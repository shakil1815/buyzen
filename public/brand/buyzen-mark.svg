  <path d="M152 170 H 360 C 392 170 412 194 405 226 L 378 382 C 372 416 344 440 310 440 H 188 C 154 440 126 416 120 382 L 98 226 C 92 194 112 170 144 170 Z" fill="url(#bzBag)"/>

